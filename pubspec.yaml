name: tripsync
description: "A new Flutter project for trip planning."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^17.3.0

  supabase_flutter: ^2.9.1

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  intl: ^0.20.2

  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.5.3

  flutter_dotenv: ^5.2.1

  cupertino_icons: ^1.0.8
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.2.0
  share_plus: ^13.1.0
  equatable: ^2.0.8
  awesome_snackbar_content: ^0.1.4
  image_picker: ^1.2.3
  uuid: ^4.5.3
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - .env

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
